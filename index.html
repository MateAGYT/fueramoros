<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FueraMoros - La nueva campaña española</title>
    <link rel="icon" href="antimoros.jpg">
    <style>
        :root {
            --primary-color: #d32f2f;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #ff5252;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrygRHI4V0liLQSFa1ccALEbYknicd-SkLXSFdnoH-crsC8LQ2_SkhzAQ&s=10');
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 600px;
            width: 100%;
            border-top: 5px solid var(--primary-color);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .image-gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .image-gallery img {
            max-width: 150px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 2px solid #333;
            transition: transform 0.3s ease;
        }

        .image-gallery img:hover {
            transform: scale(1.05);
        }

        p {
            font-size: 1rem;
            color: #b0b0b0;
            line-height: 1.5;
        }

        a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        a:hover {
            color: #ff867f;
            text-decoration: underline;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #b71c1c;
        }

        @media print {
            body * { visibility: hidden; }
            #printable, #printable * { visibility: visible; }
            #printable { position: absolute; left: 0; top: 0; width: 100%; }
            .page { page-break-after: always; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
            .page img { max-width: 100%; max-height: 100%; object-fit: contain; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FUERAMOROS - LA NUEVA CAMPAÑA DE EXPULSIÓN</h1>
        <div class="image-gallery">
            <img src="antimoros.jpg" alt="Antimoros">
            <img src="sprayantimoros.png" alt="Spray Antimoros">
        </div>
        <p>
            Desarrollado y manifestado por <a href="https://mateag.com" target="_blank" rel="noopener noreferrer">MateAG</a> con ❤️ pensando en los españoles! 🐖 (recuerda que todo es humor)

            <br> <br>Espántalos enviándoles esta web o imprimiendo este PDF y deslizandóselo por debajo de la puerta.
        </p>
        <button onclick="window.location.href='https://fueramoros.es/EL JAMÓN.pdf'">¿POR QUÉ DEBÉIS IROS DE ESPAÑA?</button>
        <button onclick="window.location.href='https://github.com/MateAGYT/fueramoros'">MEJORAS Y PULL REQUESTS</button>
    </div>
</body>
</html>
